<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Chatbot Test Ekranı</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  #messages { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 12px; border-radius: 8px; }
  .msg { margin-bottom: 10px; }
  .msg.user { text-align: right; }
  .msg .bubble { display: inline-block; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
  .msg.user .bubble { background: #0d6efd; color: white; }
  .msg.bot .bubble { background: #f1f1f1; color: #111; }
  #input-row { display: flex; margin-top: 12px; gap: 8px; }
  #input-row input { flex: 1; padding: 8px; }
  #input-row button { padding: 8px 16px; }
</style>
</head>
<body>
  <h2>Chatbot Test Ekranı</h2>
  <div id="messages"></div>
  <div id="input-row">
    <input id="message-input" type="text" placeholder="Bir soru yazın..." autofocus>
    <button id="send-button">Gönder</button>
  </div>

  <script>
    let conversationId = null;
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");

    function addMessage(text, sender) {
      const wrapper = document.createElement("div");
      wrapper.className = "msg " + sender;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) return;
      addMessage(text, "user");
      inputEl.value = "";
      sendButton.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, conversation_id: conversationId }),
        });
        const data = await response.json();
        conversationId = data.conversation_id;
        addMessage(data.answer, "bot");
      } catch (error) {
        addMessage("Bir hata oluştu, lütfen tekrar deneyin.", "bot");
      } finally {
        sendButton.disabled = false;
        inputEl.focus();
      }
    }

    sendButton.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
